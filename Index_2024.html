<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket Scanner</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            padding: 15px;
            background: #f5f5f5;
            min-height: 100vh;
        }

        .container {
            max-width: 100%;
            margin: 0 auto;
        }

        .input-section {
            margin-bottom: 20px;
        }

        .input-section h3 {
            font-size: 16px;
            margin-bottom: 10px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 5px;
        }

        .hint {
            font-size: 12px;
            color: #666;
            font-style: italic;
            margin-bottom: 15px;
        }

        #qr-reader {
            width: 100%;
            margin-bottom: 20px;
        }

        #qr-reader video {
            width: 100% !important;
            height: auto !important;
            border-radius: 8px;
        }

        #result-section {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            background: white;
        }

        #scan-result {
            font-size: 14px;
            line-height: 1.5;
            word-break: break-word;
        }

        #qr-reader__dashboard_section_csr button {
            background: #007AFF;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            margin: 5px;
        }

        /* Hide default QR reader elements we don't need */
        #qr-reader__status_span {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="input-section">
            <h3>Identitas Penukar Tiket</h3>
            <input type="text" id="exchanger-name" placeholder="Masukkan nama penukar tiket">
            <div class="hint">Format: Nama (No. HP)</div>
        </div>
        <div id="qr-reader"></div>
        <div id="result-section">
            <div id="scan-result"></div>
        </div>
    </div>

    <script>
        function onScanSuccess(decodedText) {
            const exchangerName = document.getElementById('exchanger-name').value;
            
            if (!exchangerName) {
                document.getElementById('scan-result').innerHTML = "Mohon isi identitas penukar tiket terlebih dahulu.";
                return;
            }

            google.script.run
                .withSuccessHandler(function(response) {
                    document.getElementById('scan-result').innerHTML = response;
                    if (response.includes("Tiket sudah ditukarkan")) {
                        document.getElementById('exchanger-name').value = '';
                    }
                })
                .withFailureHandler(function(error) {
                    document.getElementById('scan-result').innerHTML = "Error: " + error.message;
                })
                .validateAndProcessTicket(decodedText, exchangerName);
        }

        const html5QrcodeScanner = new Html5QrcodeScanner(
            "qr-reader", 
            { 
                fps: 10,
                qrbox: { width: 250, height: 250 },
                aspectRatio: 1.0
            }
        );
        
        html5QrcodeScanner.render(onScanSuccess);
    </script>
</body>
</html>
